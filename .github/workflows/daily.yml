name: AI Daily Digest

on:
  # 定时生成已迁到 Mac Mini（Hermes cron，北京 04:00），此流程仅保留为手动应急入口。
  # 应急执行前先确认当天 docs/daily/<date>.html 尚未生成，避免与本地任务双重调度。
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      digest_date: ${{ steps.identity.outputs.date }}
      rss_sha: ${{ steps.identity.outputs.rss_sha }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate daily digest
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.deepseek.com' }}
          API_MODEL: ${{ vars.API_MODEL || 'deepseek-chat' }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: cd scripts && python main.py

      - name: Record publication identity
        id: identity
        run: |
          echo "date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"
          echo "rss_sha=$(sha256sum docs/podcast.xml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          git config user.name "AI Daily Bot"
          git config user.email "bot@github.com"
          git add daily/ data/ docs/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            DATE=$(TZ=Asia/Shanghai date +"%Y-%m-%d")
            git commit -m "📰 Daily digest for ${DATE}"
            git pull --rebase
            git push
          fi

  # GrokBot webhook（notify job）已移除：小宇宙发布改由本地 Hermes cron 的
  # xiaoyuzhou-publisher 流程负责，失败不再靠外部 Webhook 汇报。
