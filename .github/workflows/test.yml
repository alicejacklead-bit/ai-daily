name: Test run (no publish)

# 手动测试：完整跑一遍抓取 → 摘要 → 英文 → 播客 → 网站，
# 结果打包成 Artifact 供下载查看。不提交、不发布网站。
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate digest (dry run)
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.deepseek.com' }}
          API_MODEL: ${{ vars.API_MODEL || 'deepseek-chat' }}
        run: set -o pipefail; cd scripts && python main.py 2>&1 | tee ../run.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            run.log
            daily/
            data/
            docs/
          retention-days: 7
